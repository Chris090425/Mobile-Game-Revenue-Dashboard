            "feature": "해수면 상승 이후의 세계를 배경으로 자원 채집, 뗏목 확장, 생존자 영입 기반의 거점 성장과 해적, 상어 방어 전투를 결합한 해양 생존 SLG",
            "refs": [],
            "auto": { "growth_pct": 11, "change": 3, "status": "", "revenue": 66814 }
          },
          {
            "kind": "매출 상승", "title": "리그 오브 레전드: 와일드 리프트", "rank": 12, "genre": "MOBA", "publisher": "라이엇게임즈",
            "feature": "원작 <리그 오브 레전드>의 챔피언과 소환사의 협곡을 배경으로 5대5 라인 교전과 15~20분 단축 매치를 결합한 MOBA",
            "refs": [],
            "auto": { "growth_pct": 453, "change": "RE", "status": "▲", "revenue": 55847 }
          },
          {
            "kind": "매출 상승", "title": "마작명성3결1", "rank": 13, "genre": "소셜 카지노", "publisher": "IGS",
            "feature": "대만 유명인 캐릭터를 배경으로 16장 대만식 마작 대전과 포커, 슬롯 미니게임을 결합한 온라인 마작 게임",
            "refs": [],
            "auto": { "growth_pct": 30, "change": "RE", "status": "", "revenue": 54171 }
          }
        ]
      }
    };

    function formatCurrency(num, region) {
      if (!num) return "-";
      const val = parseInt(num).toLocaleString();
      return `$ ${val}`; // 원본 데이터가 모두 통합 달러(USD) 기준인 것으로 보여 통일
    }

    function renderChangeBadge(change, kind) {
      if (kind === "신규 출시") return `<span class="badge-rank-change badge-new">NEW</span>`;
      if (change === "RE") return `<span class="badge-rank-change badge-re">재진입</span>`;
      if (change === 0) return `<span class="change-same">-</span>`;
      return String(change).includes("▲") || change > 0 ? `<span class="change-up">▲${Math.abs(change)}</span>` : `<span class="change-down">▼${Math.abs(change)}</span>`;
    }
    
    function renderMiniBars() {
      const bars = Array.from({length: 7}, () => Math.floor(Math.random() * 55) + 40);
      return `<div class="mini-chart">${bars.map(h => `<div class="mini-bar" style="height:${Math.max(3, Math.round(h * 0.16))}px;"></div>`).join('')}</div>`; 
    }

    // ★ 수정된 API 호출부: 브라우저 보안 차단 시 원본 백업본을 무조건 출력합니다.
    async function fetchDashboardData(date, region) {
      document.getElementById("noticeText").innerText = "데이터 로딩 중...";
      const targetUrl = `https://webzendashboard.webboy0926.workers.dev/data/issues/${date}.json`;

      try {
        // 1. 직접 호출 시도 (웹 서버 환경)
        const response = await fetch(targetUrl);
        if (!response.ok) throw new Error("Direct fetch failed");
        const json = await response.json();
        processApiData(json.regions[region] || [], region);
        document.getElementById("noticeText").innerText = `${region} (${date}) — 데이터 로드 완료 (라이브 직접 연결)`;
      } catch (err1) {
        try {
          // 2. 우회 프록시 호출 시도 (allorigins get 방식이 가장 안정적)
          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
          const response = await fetch(proxyUrl);
          if (!response.ok) throw new Error("Proxy fetch failed");
          const data = await response.json();
          const json = JSON.parse(data.contents);
          processApiData(json.regions[region] || [], region);
          document.getElementById("noticeText").innerText = `${region} (${date}) — 데이터 로드 완료 (프록시 우회 연결)`;
        } catch (err2) {
          // 3. 보안 차단 시 09-29 고정 데이터 완벽 복구
          if (date === "2026-09-29") {
            processApiData(FULL_RAW_DATA.regions[region] || [], region);
            document.getElementById("noticeText").innerText = `${region} (${date}) — 브라우저 보안(CORS) 제한으로 인해 내장된 원본 데이터를 표시합니다.`;
          } else {
            apiData = [];
            renderAll();
            document.getElementById("noticeText").innerText = `${region} (${date}) — 브라우저 보안 정책으로 인해 실시간 데이터를 불러올 수 없습니다.`;
          }
        }
      }
      document.getElementById("footerDate").innerText = date;
    }

    function processApiData(rawData, region) {
      apiData = rawData.map(item => ({
        rank: item.rank, name: item.title, pub: item.publisher || item.developer, genre: item.genre, kind: item.kind,
        rev: formatCurrency(item.auto?.revenue, region),
        change: item.auto?.status === "▲" ? `▲${item.auto?.change}` : (item.auto?.change || 0),
        growth: (item.auto?.growth_pct > 0 ? "+" : "") + (item.auto?.growth_pct || 0) + "%",
        feature: item.feature, reason: item.reason, devNote: item.developer_note, refs: item.refs || [],
        rowType: item.kind === "신규 출시" ? "green" : ""
      }));
      renderAll();
    }

    function renderAll() { renderTop20Table(); renderTrackedTable(); renderNewsAccordion(); }

    function renderTop20Table() {
      const tbody = document.getElementById("top20TableBody");
      if (apiData.length === 0) return tbody.innerHTML = `<tr><td colspan="8" class="col-center" style="padding:30px;">해당 일자/국가의 데이터가 없습니다.</td></tr>`;
      tbody.innerHTML = apiData.map(item => `<tr class="${item.rowType ? 'row-' + item.rowType : ''}"><td class="col-center">${renderChangeBadge(item.change, item.kind)}</td><td class="col-center rank-num">${item.rank}</td><td><span class="game-name">${item.name}</span></td><td>${item.pub}</td><td>${item.genre}</td><td class="col-right net-revenue">${item.rev}</td><td class="col-center">${renderMiniBars()}</td><td class="col-right ${item.growth.includes('+') ? 'growth-pos' : 'growth-neg'}">${item.growth}</td></tr>`).join('');
    }

    function renderTrackedTable() {
      const tbody = document.getElementById("trackedTableBody");
      const rowsHtml = trackedGames.map(gameName => {
        const found = apiData.find(g => g.name.toLowerCase().trim() === gameName.toLowerCase().trim());
        if (found) return `<tr><td><strong class="game-name">${found.name}</strong></td><td class="col-center rank-num">${found.rank}위</td><td>${found.pub}</td><td>${found.genre}</td><td class="col-right net-revenue">${found.rev}</td><td class="col-center">${renderMiniBars()}</td><td class="col-right ${found.growth.includes('+') ? 'growth-pos' : 'growth-neg'}">${found.growth}</td><td class="col-center"><button class="nav-pill-btn outline" onclick="removeTrackedGame('${found.name}')">삭제</button></td></tr>`;
        return `<tr><td><strong class="game-name">${gameName}</strong></td><td class="col-center">이슈 외</td><td>-</td><td>-</td><td class="col-right">-</td><td class="col-center">-</td><td class="col-right">-</td><td class="col-center"><button class="nav-pill-btn outline" onclick="removeTrackedGame('${gameName}')">삭제</button></td></tr>`;
      }).join('');
      tbody.innerHTML = rowsHtml || `<tr><td colspan="8" class="col-center" style="padding:20px;">트래킹 중인 게임이 없습니다.</td></tr>`;
    }

    function renderNewsAccordion() {
      const wrap = document.getElementById("newsAccordion");
      if (apiData.length === 0) return wrap.innerHTML = `<div style="padding:20px; text-align:center;">비즈니스 이슈가 없습니다.</div>`;
      wrap.innerHTML = apiData.map((item, idx) => `
        <div class="news-item">
          <div class="news-item-header" onclick="toggleAccordion(${idx})">
            <span class="news-game-tag">🎮 ${item.name} <span style="font-size:12px; font-weight:500;">— [${item.kind}]</span></span>
            <span style="font-size:11px;" id="acc-arrow-${idx}">${idx === 0 ? '▲ 접기' : '▼ 펼치기'}</span>
          </div>
          <div class="news-item-body ${idx === 0 ? 'active' : ''}" id="acc-body-${idx}">
            <div class="insight-box">
              <div class="insight-title"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>비즈니스 특징 및 매출 변동 요인</div>
              <p style="margin-bottom:8px;"><strong>게임 특징:</strong> ${item.feature || "정보 없음"}</p>
              ${item.reason ? `<p style="margin-bottom:8px;"><strong>변동 사유:</strong> ${item.reason}</p>` : ''}
              ${item.devNote ? `<p style="color:#636b78; font-size:12px;"><strong>개발사 노트:</strong> ${item.devNote}</p>` : ''}
            </div>
            ${item.refs.length > 0 ? item.refs.map(art => `<div class="article-row"><a href="${art.url}" target="_blank" class="article-link">${art.title}</a></div>`).join('') : '<div class="article-row">관련 기사가 없습니다.</div>'}
          </div>
        </div>
      `).join('');
    }

    function toggleAccordion(idx) {
      const body = document.getElementById(`acc-body-${idx}`), arrow = document.getElementById(`acc-arrow-${idx}`);
      if (body.classList.contains("active")) { body.classList.remove("active"); arrow.textContent = "▼ 펼치기"; } 
      else { body.classList.add("active"); arrow.textContent = "▲ 접기"; }
    }

    function switchCountry(code) {
      currentRegion = code;
      document.querySelectorAll("#countryTabs .nav-pill-btn").forEach(btn => {
        const n = code === 'KR'?'한국':code==='TW'?'대만':code==='JP'?'일본':code==='US'?'미국':'중국';
        btn.className = btn.textContent.includes(n) ? "nav-pill-btn active" : "nav-pill-btn outline";
      });
      fetchDashboardData(currentDate, currentRegion);
    }
    
    function handleDateChange(val) { currentDate = val; fetchDashboardData(currentDate, currentRegion); }

    const searchInput = document.getElementById('trackInput'), autocompleteList = document.getElementById('autocompleteList');
    searchInput.addEventListener('input', function() {
      const val = this.value.trim().toLowerCase();
      autocompleteList.innerHTML = '';
      if (!val) { autocompleteList.style.display = 'none'; return; }
      const matched = [...new Set(apiData.map(g => g.name))].filter(g => g.toLowerCase().includes(val));
      if (matched.length > 0) {
        matched.forEach(game => {
          const li = document.createElement('li');
          li.innerHTML = game.replace(new RegExp(`(${val})`, "gi"), "<span style='color: var(--accent-blue); font-weight: 800;'>$1</span>");
          li.addEventListener('click', function() { searchInput.value = game; autocompleteList.style.display = 'none'; searchAndAddTrackedGame(); });
          autocompleteList.appendChild(li);
        });
        autocompleteList.style.display = 'block';
      } else autocompleteList.style.display = 'none';
    });
    
    searchInput.addEventListener('keypress', e => { if(e.key === 'Enter') { autocompleteList.style.display = 'none'; searchAndAddTrackedGame(); } });
    document.addEventListener('click', e => { if (e.target !== searchInput && e.target !== autocompleteList) autocompleteList.style.display = 'none'; });

    function searchAndAddTrackedGame() {
      const name = searchInput.value.trim();
      if (!name) return showToast("게임명을 입력해주세요.");
      if (trackedGames.includes(name)) return showToast("이미 등록된 게임입니다.");
      trackedGames.unshift(name); renderTrackedTable(); searchInput.value = ""; showToast(`추가되었습니다.`);
    }
    function removeTrackedGame(name) { trackedGames = trackedGames.filter(g => g !== name); renderTrackedTable(); showToast(`제거되었습니다.`); }

    function scrollToSection(id) { document.getElementById(id).scrollIntoView({ behavior: 'smooth' }); }
    function showToast(msg) {
      const t = document.getElementById("toastBox");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    window.addEventListener("DOMContentLoaded", () => { fetchDashboardData(currentDate, currentRegion); });
  </script>
</body>
</html>
